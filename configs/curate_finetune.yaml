schema_version: 1
task: curate_finetune
profile: "${FINETUNE_PROFILE:-data_only}"

gold_source_descriptor_root: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/finetune/${HAND_FINETUNE_ID:-v3-finetune-r1}/sources/gold"
replay_source_descriptor_root: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/finetune/${HAND_FINETUNE_ID:-v3-finetune-r1}/sources/replay"

gold_aggregate:
  descriptor: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/finetune/${HAND_FINETUNE_ID:-v3-finetune-r1}/hmlf_gold_merged/hmlf_gold_aggregate.json"

allowed_crop_roots:
  - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/finetune/${HAND_FINETUNE_ID:-v3-finetune-r1}"
  - "${HAND_DATASET_ROOT:-/root/autodl-tmp/DatesetFab}"

# Gold sources are authenticated even when disabled, but disabled rows do not
# enter training, weighting or smoke. Unlisted Gold sources follow the default.
# Replay is deliberately absent from this map because it is mandatory.
source_selection:
  default_gold_enabled: true
  gold:
    dragon_gold_0716_v1: false

sources:
  dragon_gold:
    discover_kind: external_gold
    enabled: auto
    required: false
    target_gold_weight: 0.40
  negative_removed_gold:
    discover_kind: reviewed_hard_gold
    enabled: auto
    required: false
    target_gold_weight: 0.15
  disagreement_gold:
    discover_kind: disagreement_gold
    enabled: auto
    required: false
    target_gold_weight: 0.30
  new_recorded_gold:
    discover_kind: new_recorded_gold
    enabled: auto
    required: false
    target_gold_weight: 0.15
  pretrain_replay:
    discover_kind: pretrain_replay
    enabled: true
    required: true

gate:
  minimum_gold_positive: 256
  require_at_least_one_gold_source: true
  require_replay: true
  fail_on_val_test_leakage: true

leakage:
  validation_labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/val_merged/05_labels/hand_validation_labels.jsonl"
  validation_ignored: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/val_merged/05_labels/hand_val_ignored.jsonl"
  test_labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/test_merged/05_labels/hand_test_labels.jsonl"
  test_ignored: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/test_merged/05_labels/hand_test_ignored.jsonl"

smoke:
  salt: finetune_smoke_v1

output:
  dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/train_finetune_merged/${HAND_FINETUNE_ID:-v3-finetune-r1}"
  overwrite: false

