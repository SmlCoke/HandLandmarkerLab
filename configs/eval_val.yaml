schema_version: 1
task: evaluate
split: val

data:
  data_root: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources"
  labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/val_merged/05_labels/hand_validation_labels.jsonl"
  ignored_labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/val_merged/05_labels/hand_val_ignored.jsonl"
  crop_image_roots:
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources/peak_vals/02_roi_crops/images"
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources/soar_vals/02_roi_crops/images"
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources/peak_vali/02_roi_crops/images"
  allowed_crop_roots:
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources"
  crop_path_key: crop_path
  path_policy: canonical_crop_path_only
  require_schema_version: evaluation_gold_v1
  image_size: [256, 256]
  channels: 1

model:
  version: v2
  checkpoint_stage: "${HAND_MODEL_STAGE:-pretrain}"
  input_shape: [1, 256, 256]
  input_layout: NCHW
  input_dtype: float32
  input_scale: 0.00392156862745098
  input_offset: 0.0
  num_iterations: [2, 2, 3, 4, 4, 6, 6]
  output_order: [landmarks, hand_flag, handedness]
  output_sizes:
    landmarks: 42
    hand_flag: 1
    handedness: 1

hand:
  backend: keras
  model_path: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/hand_landmarker_runs/${HAND_EXPERIMENT_ID:-v2-pretrain-r3}/${HAND_RUN_PHASE:-geometry}/checkpoints/best.weights.h5"

evaluation:
  # Canonical inputs are already 256x256 Hand ROIs. Evaluation loads only Hand.
  mode: roi
  hand_flag_threshold: 0.50
  threshold_sweep: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  pck_thresholds: [0.05, 0.10, 0.15]
  tune_thresholds: true

inference:
  batch_size: 128

output:
  dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/hand_landmarker_runs/${HAND_EXPERIMENT_ID:-v2-pretrain-r3}/eval/${HAND_RUN_PHASE:-geometry}/val"
  overwrite: false

runtime:
  gpu_memory_growth: true
  deterministic: false
