schema_version: 1
task: curate_pretrain

source:
  labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/train_pretrain_merged/05_labels/hand_training_labels_pretrain.jsonl"
  crop_root: "${HAND_DATASET_ROOT:-/root/autodl-tmp/DatesetFab}"

curation:
  # LOW handedness confidence does not invalidate otherwise useful geometry;
  # handedness is disabled during the geometry phase.
  allowed_positive_quality_tiers: [HIGH, MEDIUM]
  normalized_coordinate_range: [0.0, 1.0]

  # A teacher abstention is never treated as verified background by default.
  overlap_core_landmark_ids: [0, 1, 5, 9, 13, 17]
  overlap_minimum_core_points: 3

  # This subset is persisted for the mandatory overfit gate before full train.
  smoke_subset_size: 128
  smoke_selection_salt: pretrain_landmark_smoke_v3

  # Automatically reserve complete dataset sources for teacher-labelled
  # evaluation. The optional environment regex narrows the eligible source
  # generation without requiring anyone to select individual files.
  teacher_holdout:
    enabled: true
    selection_unit: dataset_id
    eligible_dataset_pattern: "${HAND_PRETRAIN_HOLDOUT_DATASET_PATTERN:-.*}"
    minimum_positive_records: 5000
    target_positive_records: 8192
    maximum_positive_records: 10000
    selection_salt: pretrain_teacher_holdout_v1

review:
  # The first curation run creates candidates and an empty reviewed directory.
  # Copy candidates to reviewed without changing relative paths, then delete
  # every ROI containing a hand or uncertain hand-like content from reviewed.
  # Finalization never infers review decisions from the original candidates.
  decisions_file: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/hand_landmarker_reviews/${HAND_PRETRAIN_ID:-v3-pretrain-r1}/negative_review_decisions.jsonl"
  candidates_subdir: negative_candidates
  reviewed_subdir: negative_reviewed
  removed_subdir: negative_removed
  quarantine_subdir: negative_quarantine
  removed_manifest_file: negative_removed_manifest.jsonl
  quarantine_manifest_file: negative_quarantine_manifest.jsonl
  cleanup_candidates_after_success: true
  retain_reviewed_evidence: true
  reviewer: hlml-visual-review-team

output:
  dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/train_pretrain_curated/${HAND_PRETRAIN_ID:-v3-pretrain-r1}"
  overwrite: false
