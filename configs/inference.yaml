schema_version: 1
task: infer_folder

input:
  images_dir: "${HLML_INFER_INPUT:-/root/autodl-tmp/DatesetFab/InferSource/0718/images}"
  recursive: true
  extensions: [.png, .jpg, .jpeg, .tif, .tiff, .bmp]
  rotate_clockwise: false
  source_orientation: as_stored_no_auto_rotate

palm:
  models_root: palm_detector
  model_id: "${HLML_PALM_MODEL_ID:-eos-2.1}"
  model_filename: model_opt.onnx
  input_width: 384
  input_height: 224
  input_layout: NCHW
  color_mode: grayscale
  feature_levels:
    - name: 14x24
      height: 14
      width: 24
      anchor_sizes:
        - [0.1188828125, 0.2170138889]
        - [0.129875, 0.34175]
    - name: 7x12
      height: 7
      width: 12
      anchor_sizes:
        - [0.171640625, 0.2737222222]
        - [0.193296875, 0.4076527778]
  score_threshold: 0.25
  nms_iou_threshold: 0.10
  max_detections: 2
  output_layout: nchw
  providers: [CPUExecutionProvider]

hand_roi:
  scale_x: 1.8
  scale_y: 1.8
  shift_x: 0.0
  shift_y: -0.1
  output_size: 256
  rotation_convention: board_wrist_to_middle_mcp

model:
  version: "${HLML_MODEL_VERSION:-v3-pro}"
  checkpoint_stage: "${HLML_CHECKPOINT_STAGE:-pretrain}"
  input_shape: [1, 256, 256]
  input_layout: NCHW
  input_dtype: float32
  input_scale: 0.00392156862745098
  input_offset: 0.0
  num_iterations: [2, 2, 3, 4, 4, 6, 6]
  output_order: [landmarks, hand_flag, handedness]
  output_sizes: {landmarks: 42, hand_flag: 1, handedness: 1}

hand:
  backend: keras
  model_path: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/runs/${HLML_EXPERIMENT_ID:-iris-v3-pro-r1}/${HLML_STAGE:-geometry}/checkpoints/best.weights.h5"

inference:
  batch_size: 64
  hand_flag_threshold: 0.50
  fail_fast: false

output:
  dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/inference/${HLML_EXPERIMENT_ID:-iris-v3-pro-r1}/${HLML_STAGE:-geometry}"
  write_annotated_images: true
  write_jsonl: true
  draw_palm_box: true
  draw_roi: true
  draw_landmarks: true
  draw_scores: true
  overwrite: false

runtime:
  gpu_memory_growth: true
  deterministic: false
