extends: train_geometry.yaml

experiment:
  name: hand_landmarker_v2_multitask

data:
  labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/train_pretrain_curated/${HAND_PRETRAIN_ID:-v3-pretrain-r1}/05_labels/hand_training_labels_pretrain_multitask.jsonl"

training:
  epochs: 80
  initial_checkpoint: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/hand_landmarker_runs/${HAND_PRETRAIN_ID:-v3-pretrain-r1}/geometry/checkpoints/best.weights.h5"
  optimizer:
    learning_rate: 0.00005
  early_stopping:
    monitor: val_multitask_score
    mode: min
    patience: 15
  checkpoint: {monitor: val_multitask_score, mode: min}
  learning_rate_schedule:
    monitor: val_multitask_score
    mode: min
  multitask_monitor:
    enabled: true
    name: val_multitask_score
    landmark_mae_weight: 1.0
    hand_flag_error_weight: 0.02
    handedness_error_weight: 0.005

sampling:
  epoch_size: auto
  epoch_size_upper_bound: 6400
  max_average_cell_draws_per_unique_record: 4.0
  max_expected_row_draws_per_epoch: 8.0
  sample_type_fractions:
    POS_RUNTIME: 0.72
    POS_LOW_PALM: 0.18
    NEG_RUNTIME_CANDIDATE: 0.08
    NEG_LOW_PALM_CANDIDATE: 0.02

losses:
  landmarks: {name: huber, delta: 0.05, coefficient: 20.0}
  hand_flag: {name: binary_crossentropy, from_logits: false, coefficient: 0.25}
  handedness: {name: binary_crossentropy, from_logits: false, coefficient: 0.05}

outputs:
  run_dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/hand_landmarker_runs/${HAND_PRETRAIN_ID:-v3-pretrain-r1}/multitask"

multitask_gate:
  minimum_confirmed_negatives: 500
  minimum_confirmed_by_sample_type:
    NEG_RUNTIME_CANDIDATE: 100
    NEG_LOW_PALM_CANDIDATE: 100
  require_review_method: retained_after_visual_deletion_review
  require_review_fields: [reviewer, reviewed_at, review_method, review_image_sha256]
