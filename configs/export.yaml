schema_version: 1
task: export_onnx

model:
  version: v1
  checkpoint_stage: pretrain
  input_shape: [1, 256, 256]
  input_layout: NCHW
  input_dtype: float32
  num_iterations: 8
  output_order: [landmarks, hand_flag, handedness]
  output_sizes:
    landmarks: 42
    hand_flag: 1
    handedness: 1

hand:
  backend: keras
  model_path: "${HAND_DATA_ROOT:-/root/autodl-tmp}/hand_landmarker_runs/${HAND_PRETRAIN_RUN_ID:-v1-pretrain-geometry}/pretrain/checkpoints/best.weights.h5"

export:
  model_path: "${HAND_DATA_ROOT:-/root/autodl-tmp}/hand_landmarker_runs/${HAND_PRETRAIN_RUN_ID:-v1-pretrain-geometry}/export/pretrain/hand_landmarker_v1_pretrain.onnx"
  opset: 11
  input_name: inputs
  output_names: [landmarks, hand_flag, handedness]
  dynamic_batch: false
  overwrite: false
  strict_a1_operators: true
  a1_allowed_operators: [Conv, Add, LeakyRelu, MaxPool, Sigmoid, Identity]
  metadata:
    input_layout: NCHW
    input_color: grayscale
    input_scale: 0.00392156862745098
    landmark_space: normalized_crop_xy
    landmark_order: id_0_to_20_interleaved_xy
    handedness_left: 0
    handedness_right: 1
  validate:
    enabled: true
    backend: onnxruntime_cpu
    random_samples: 4
    absolute_tolerance: 1.0e-5
    relative_tolerance: 1.0e-4
    require_output_order_match: true
  # Generated only as independent export artifacts. Canonical JSONL/ROI files
  # are opened read-only and are never copied back into Train/Val/Test roots.
  conversion_datasets:
    enabled: true
    output_dir: "${HAND_DATA_ROOT:-/root/autodl-tmp}/hand_landmarker_runs/${HAND_PRETRAIN_RUN_ID:-v1-pretrain-geometry}/export/pretrain/model_conversion"
    selection_salt: hand_landmarker_v1_conversion_inputs_v1
    input:
      shape: [1, 1, 256, 256]
      layout: NCHW
      dtype: float32
      normalization: uint8_div_255
    sets:
      calibrate_datasets:
        minimum_count: 20
        sources:
          train:
            config_path: configs/train_pretrain.yaml
            count: 100
            stratify_by: [sample_type, dataset_id]
      evaluate_datasets:
        minimum_count: 10
        sources:
          val:
            config_path: configs/eval_val_pretrain.yaml
            count: 25
            stratify_by: [dataset_id, hand_presence.present, handedness.label]
          test:
            config_path: configs/eval_test_pretrain.yaml
            count: 25
            stratify_by: [dataset_id, hand_presence.present, handedness.label]

runtime:
  device: cpu
