schema_version: 1
task: export_onnx

model:
  version: v2
  checkpoint_stage: "${HAND_MODEL_STAGE:-pretrain}"
  input_shape: [1, 256, 256]
  input_layout: NCHW
  input_dtype: float32
  num_iterations: [2, 2, 3, 4, 4, 6, 6]
  output_order: [landmarks, hand_flag, handedness]
  output_sizes:
    landmarks: 42
    hand_flag: 1
    handedness: 1

hand:
  backend: keras
  model_path: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/hand_landmarker_runs/${HAND_EXPERIMENT_ID:-v2-pretrain-r3}/${HAND_RUN_PHASE:-geometry}/checkpoints/best.weights.h5"

export:
  model_path: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/hand_landmarker_runs/${HAND_EXPERIMENT_ID:-v2-pretrain-r3}/export/${HAND_RUN_PHASE:-geometry}/hand_landmarker_v2.onnx"
  opset: 11
  input_name: inputs
  output_names: [landmarks, hand_flag, handedness]
  dynamic_batch: false
  maximum_model_size_mb: 15.0
  maximum_depthwise_group: 128
  minimum_quantization_output_range: 1.0e-6
  overwrite: false
  strict_a1_operators: true
  a1_allowed_operators: [Conv, Add, Relu, MaxPool, Sigmoid, Identity, Reshape]
  metadata:
    input_layout: NCHW
    input_color: grayscale
    input_scale: 0.00392156862745098
    landmark_space: normalized_crop_xy
    landmark_order: id_0_to_20_interleaved_xy
    handedness_left: 0
    handedness_right: 1
  validate:
    enabled: true
    backend: onnxruntime_cpu
    random_samples: 4
    fusion_absolute_tolerance: 5.0e-5
    fusion_relative_tolerance: 5.0e-4
    absolute_tolerance: 1.0e-5
    relative_tolerance: 1.0e-4
    require_output_order_match: true
  # Generated only as independent export artifacts. Canonical JSONL/ROI files
  # are opened read-only and are never copied back into Train/Val/Test roots.
  conversion_datasets:
    enabled: true
    output_dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/hand_landmarker_runs/${HAND_EXPERIMENT_ID:-v2-pretrain-r3}/export/${HAND_RUN_PHASE:-geometry}/model_conversion"
    selection_salt: hand_landmarker_v2_conversion_inputs_v1
    input:
      shape: [1, 1, 256, 256]
      layout: NCHW
      dtype: float32
      normalization: uint8_div_255
    sets:
      calibrate_datasets:
        minimum_count: 20
        sources:
          train:
            config_path: "${HAND_TRAIN_CONFIG:-configs/train_geometry.yaml}"
            count: 100
            stratify_by: [sample_type, dataset_id]
      evaluate_datasets:
        minimum_count: 10
        sources:
          val:
            config_path: configs/eval_val.yaml
            count: 25
            stratify_by: [dataset_id, hand_presence.present, handedness.label]
          test:
            config_path: configs/eval_test.yaml
            count: 25
            stratify_by: [dataset_id, hand_presence.present, handedness.label]

runtime:
  device: cpu
