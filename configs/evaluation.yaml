schema_version: 1
task: evaluate
profile: "${HLML_EVALUATION_SPLIT:-val}"
split: val

data:
  data_root: "${HAND_DATASET_ROOT:-/root/autodl-tmp/DatesetFab}"
  labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/snapshots/${HLML_SNAPSHOT_ID:-v4-r1}/${HLML_STAGE:-geometry}/val.jsonl"
  crop_path_key: crop_path
  path_policy: canonical_crop_path_only
  allowed_crop_roots: ["${HAND_DATASET_ROOT:-/root/autodl-tmp/DatesetFab}"]
  require_schema_version: hlml_fixed_roi_evaluation_v1
  image_size: [256, 256]
  channels: 1

model:
  version: v2
  checkpoint_stage: "${HLML_CHECKPOINT_STAGE:-pretrain}"
  input_shape: [1, 256, 256]
  input_layout: NCHW
  input_dtype: float32
  input_scale: 0.00392156862745098
  input_offset: 0.0
  num_iterations: [2, 2, 3, 4, 4, 6, 6]
  output_order: [landmarks, hand_flag, handedness]
  output_sizes: {landmarks: 42, hand_flag: 1, handedness: 1}

hand:
  backend: keras
  model_path: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/runs/${HLML_EXPERIMENT_ID:-v4-r1}/${HLML_STAGE:-geometry}/checkpoints/best.weights.h5"

evaluation:
  mode: roi
  hand_flag_threshold: 0.50
  threshold_sweep: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90]
  pck_thresholds: [0.05, 0.10, 0.15]
  tune_thresholds: true

inference:
  batch_size: 128

output:
  dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/runs/${HLML_EXPERIMENT_ID:-v4-r1}/eval/${HLML_STAGE:-geometry}/val"
  overwrite: false

runtime:
  gpu_memory_growth: true
  deterministic: false

profiles:
  val: {}

  test:
    split: test
    data:
      labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/snapshots/${HLML_SNAPSHOT_ID:-v4-r1}/${HLML_STAGE:-geometry}/test.jsonl"
    evaluation:
      tune_thresholds: false
      threshold_sweep: []
    output:
      dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/releases/${HLML_RELEASE_ID:-v4-r1}/test"
      overwrite: false
