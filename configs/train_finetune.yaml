schema_version: 1
task: train
stage: finetune

experiment:
  name: hand_landmarker_v2_finetune
  seed: 20260716

environment:
  python: ">=3.8,<3.9"
  tensorflow: "==2.9.0"
  cuda: "11.2"
  cudnn_major: 8
  require_gpu: true

data:
  data_root: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/train_finetune_merged/${HAND_FINETUNE_ID:-v2-finetune-r1}"
  labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/train_finetune_merged/${HAND_FINETUNE_ID:-v2-finetune-r1}/05_labels/hand_training_labels_finetune.jsonl"
  curation_manifest: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/train_finetune_merged/${HAND_FINETUNE_ID:-v2-finetune-r1}/qc/sha256_manifest.json"
  require_curation_schema: finetune_curation_v1
  require_schema_version: train_finalize_v1
  require_training_stage: finetune
  crop_path_key: crop_path
  path_policy: canonical_crop_path_only
  crop_image_roots:
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/finetune/${HAND_FINETUNE_ID:-v2-finetune-r1}"
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/train_sources"
  allowed_crop_roots:
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/finetune/${HAND_FINETUNE_ID:-v2-finetune-r1}"
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/train_sources"
  image_size: [256, 256]
  channels: 1
  color_mode: grayscale
  input_layout: NCHW
  input_dtype: float32
  input_scale: 0.00392156862745098
  input_offset: 0.0
  cache: false

model:
  version: v2
  checkpoint_stage: finetune
  input_shape: [1, 256, 256]
  input_layout: NCHW
  num_iterations: [2, 2, 3, 4, 4, 6, 6]
  output_order: [landmarks, hand_flag, handedness]
  output_sizes: {landmarks: 42, hand_flag: 1, handedness: 1}

targets:
  num_landmarks: 21
  landmark_field: landmarks_crop_norm
  landmark_space: normalized_crop_xy
  landmark_order: id_0_to_20_interleaved_xy
  presence_field: hand_presence.present
  handedness_field: handedness.label
  handedness_encoding: {Left: 0, Right: 1, unknown: null}

training:
  epochs: 40
  batch_size: 64
  steps_per_epoch: null
  initial_checkpoint: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/hand_landmarker_runs/${HAND_PRETRAIN_ID:-v2-pretrain-r3}/multitask/checkpoints/best.weights.h5"
  resume_checkpoint: null
  gold_fraction: 0.35
  gradient_clip_norm: 5.0
  mixed_precision: false
  optimizer:
    name: adam
    learning_rate: 0.00001
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-7
  checkpoint: {monitor: val_landmark_mae, mode: min}
  learning_rate_schedule:
    name: reduce_on_plateau
    monitor: val_landmark_mae
    mode: min
    factor: 0.5
    patience: 3
    min_learning_rate: 1.0e-7
  early_stopping:
    enabled: true
    monitor: val_landmark_mae
    mode: min
    patience: 8
    restore_best_weights: true

sampling:
  enabled: true
  stratify_by: [supervision_tier, sample_type]
  tier_key: supervision_tier
  sample_type_key: sample_type
  bucket_key: sampling_bucket
  weight_key: sampling_weight
  epoch_size: 12000
  quota_scope:
    supervision_tier: per_batch_half_up
    sample_type: per_epoch_largest_remainder
  batch_distribution: deterministic_balanced_deficit
  tail_batch_policy: allow_smaller_final_batch
  sample_type_fractions_by_tier:
    gold:
      POS_RUNTIME: 0.70
      POS_LOW_PALM: 0.20
      NEG_RUNTIME_CANDIDATE: 0.07
      NEG_LOW_PALM_CANDIDATE: 0.03
    pseudo:
      POS_RUNTIME: 0.72
      POS_LOW_PALM: 0.18
      NEG_RUNTIME_CANDIDATE: 0.06
      NEG_LOW_PALM_CANDIDATE: 0.04
  missing_cell_policy:
    gold: redistribute_within_tier
    pseudo: fail
  rare_cell_policy:
    gold: cap_fraction_then_redistribute_within_tier
    pseudo: fail
    max_average_draws_per_unique_record: 4.0
    max_expected_row_draws_per_epoch: 8.0
  quota_rounding: largest_remainder
  quota_tie_break: [POS_RUNTIME, POS_LOW_PALM, NEG_RUNTIME_CANDIDATE, NEG_LOW_PALM_CANDIDATE]
  replacement: true
  honor_record_sampling_weight: true

losses:
  landmarks: {name: huber, delta: 0.05, coefficient: 20.0}
  hand_flag: {name: binary_crossentropy, from_logits: false, coefficient: 0.25}
  handedness: {name: binary_crossentropy, from_logits: false, coefficient: 0.02}
  honor_record_loss_weights: true

augmentation:
  enabled: true
  brightness_delta: 0.08
  contrast_range: [0.90, 1.10]
  gaussian_noise_stddev: 0.005
  rotation_degrees: 5.0
  scale_range: [0.97, 1.03]
  translation_fraction: 0.02
  horizontal_flip_probability: 0.0

validation:
  enabled: true
  data_root: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources"
  labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/val_merged/05_labels/hand_validation_labels.jsonl"
  ignored_labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/val_merged/05_labels/hand_val_ignored.jsonl"
  crop_path_key: crop_path
  path_policy: canonical_crop_path_only
  crop_image_roots:
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources"
  allowed_crop_roots:
    - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources"
  batch_size: 128
  every_epochs: 1

inspection:
  compare_datasets:
    test:
      data_root: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources"
      labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/test_merged/05_labels/hand_test_labels.jsonl"
      ignored_labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/test_merged/05_labels/hand_test_ignored.jsonl"
      crop_image_roots:
        - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources"
      allowed_crop_roots:
        - "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/eval_sources"
      crop_path_key: crop_path
      path_policy: canonical_crop_path_only
      require_schema_version: evaluation_gold_v1
      require_split: test
      image_size: [256, 256]
      channels: 1

outputs:
  run_dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-2.0}/hand_landmarker_runs/${HAND_FINETUNE_ID:-v2-finetune-r1}/finetune"
  overwrite: false

runtime:
  gpu_memory_growth: true
  deterministic: false
  fail_on_nan: true
