schema_version: 1
task: train
stage: pretrain

experiment:
  name: hand_landmarker_v1_pretrain
  seed: 20260713

environment:
  python: ">=3.8,<3.9"
  tensorflow: "==2.9.0"
  cuda: "11.2"
  cudnn_major: 8
  require_gpu: true

data:
  data_root: "${HAND_DATA_ROOT:-/root/autodl-tmp}"
  labels: "${HAND_DATA_ROOT:-/root/autodl-tmp}/train_pretrain_merged/05_labels/hand_training_labels_pretrain.jsonl"
  crop_path_key: crop_path
  path_policy: canonical_crop_path_only
  require_schema_version: train_finalize_v1
  image_size: [256, 256]
  channels: 1
  color_mode: grayscale
  input_layout: NCHW
  input_dtype: float32
  input_scale: 0.00392156862745098
  input_offset: 0.0
  cache: false

model:
  version: v1
  checkpoint_stage: pretrain
  input_shape: [1, 256, 256]
  input_layout: NCHW
  num_iterations: 8
  output_order: [landmarks, hand_flag, handedness]
  output_sizes:
    landmarks: 42
    hand_flag: 1
    handedness: 1

targets:
  num_landmarks: 21
  landmark_field: landmarks_crop_norm
  landmark_space: normalized_crop_xy
  landmark_order: id_0_to_20_interleaved_xy
  presence_field: hand_presence.present
  handedness_field: handedness.label
  handedness_encoding:
    Left: 0
    Right: 1
    unknown: null
training:
  epochs: 120
  batch_size: 64
  steps_per_epoch: null
  initial_checkpoint: null
  resume_checkpoint: null
  gradient_clip_norm: 5.0
  mixed_precision: false
  optimizer:
    name: adam
    learning_rate: 0.0003
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-7
  learning_rate_schedule:
    name: reduce_on_plateau
    monitor: val_landmark_mae
    factor: 0.5
    patience: 20
    min_learning_rate: 1.0e-6
  early_stopping:
    enabled: true
    monitor: val_landmark_mae
    patience: 20
    restore_best_weights: true

sampling:
  enabled: true
  stratify_by: [supervision_tier, sample_type]
  tier_key: supervision_tier
  bucket_key: sampling_bucket
  sample_type_key: sample_type
  weight_key: sampling_weight
  # Exact per-batch type marginals: 70% positive, 25% runtime negative,
  # 5% low-Palm negative. sampling_weight is used only inside a selected cell.
  sample_type_fractions:
    POS_RUNTIME: 0.56
    POS_LOW_PALM: 0.14
    NEG_RUNTIME_CANDIDATE: 0.25
    NEG_LOW_PALM_CANDIDATE: 0.05
  quota_rounding: largest_remainder
  quota_tie_break: [POS_RUNTIME, POS_LOW_PALM, NEG_RUNTIME_CANDIDATE, NEG_LOW_PALM_CANDIDATE]
  require_all_tier_sample_type_cells: true
  epoch_size: null
  replacement: true
  honor_record_sampling_weight: true

losses:
  landmarks:
    name: huber
    delta: 0.05
    coefficient: 20.0
  hand_flag:
    name: binary_crossentropy
    from_logits: false
    coefficient: 1.0
  handedness:
    name: binary_crossentropy
    from_logits: false
    coefficient: 0.1
  honor_record_loss_weights: true

augmentation:
  enabled: true
  brightness_delta: 0.12
  contrast_range: [0.85, 1.15]
  gaussian_noise_stddev: 0.01
  rotation_degrees: 8.0
  scale_range: [0.95, 1.05]
  translation_fraction: 0.03
  horizontal_flip_probability: 0.0
  # Disabled until camera orientation and handedness mirroring are verified.

validation:
  enabled: true
  labels: "${HAND_DATA_ROOT:-/root/autodl-tmp}/val_merged/05_labels/hand_validation_labels.jsonl"
  ignored_labels: "${HAND_DATA_ROOT:-/root/autodl-tmp}/val_merged/05_labels/hand_val_ignored.jsonl"
  batch_size: 128
  every_epochs: 1

inspection:
  # This stage's Train and configured Val are compared with locked Test.
  # Finetune Train is intentionally absent: pseudo replay may overlap stages.
  compare_datasets:
    test:
      data_root: "${HAND_DATA_ROOT:-/root/autodl-tmp}"
      labels: "${HAND_DATA_ROOT:-/root/autodl-tmp}/test_merged/05_labels/hand_test_labels.jsonl"
      ignored_labels: "${HAND_DATA_ROOT:-/root/autodl-tmp}/test_merged/05_labels/hand_test_ignored.jsonl"
      crop_image_roots:
        - "${HAND_DATA_ROOT:-/root/autodl-tmp}/eval_sources/peak_test/02_roi_crops/images"
        - "${HAND_DATA_ROOT:-/root/autodl-tmp}/eval_sources/soar_test/02_roi_crops/images"
      crop_path_key: crop_path
      path_policy: canonical_crop_path_only
      require_schema_version: evaluation_gold_v1
      require_split: test
      image_size: [256, 256]
      channels: 1

outputs:
  run_dir: "${HAND_DATA_ROOT:-/root/autodl-tmp}/hand_landmarker_runs/v1-landmarks-enhanced/pretrain"
  overwrite: false

runtime:
  gpu_memory_growth: true
  deterministic: false
  fail_on_nan: true
