extends: train_pretrain.yaml

experiment:
  name: hand_landmarker_v1_pretrain_smoke

data:
  labels: "${HAND_DATA_ROOT:-/root/autodl-tmp}/train_pretrain_curated/${HAND_PRETRAIN_CURATED_ID:-v1}/05_labels/hand_training_labels_pretrain_smoke.jsonl"

training:
  epochs: 300
  batch_size: 32
  checkpoint:
    monitor: landmark_mae
    mode: min
  learning_rate_schedule:
    monitor: landmark_mae
    mode: min
    patience: 20
  early_stopping:
    monitor: landmark_mae
    mode: min
    patience: 60

losses:
  landmarks:
    name: huber
    delta: 0.05
    coefficient: 1.0
  hand_flag:
    coefficient: 0.0
  handedness:
    coefficient: 0.0

augmentation:
  enabled: false

validation:
  enabled: false

outputs:
  run_dir: "${HAND_DATA_ROOT:-/root/autodl-tmp}/hand_landmarker_runs/${HAND_PRETRAIN_RUN_ID:-v1-pretrain-geometry}/smoke"
  overwrite: false

smoke_gate:
  expected_records: 128
  maximum_mean_mae: 0.01
  maximum_p90_mae: 0.02
  maximum_max_mae: 0.05
