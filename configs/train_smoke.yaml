extends: train_geometry.yaml

experiment:
  name: hand_landmarker_v2_smoke

data:
  labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/train_pretrain_curated/${HAND_PRETRAIN_ID:-v3-pretrain-r1}/05_labels/hand_training_labels_pretrain_smoke.jsonl"

training:
  epochs: 300
  batch_size: 32
  max_wall_time_hours: null
  periodic_checkpoint: {enabled: false}
  checkpoint: {monitor: landmark_mae, mode: min}
  learning_rate_schedule:
    monitor: landmark_mae
    mode: min
    patience: 20
  early_stopping:
    monitor: landmark_mae
    mode: min
    patience: 60

losses:
  landmarks: {name: huber, delta: 0.05, coefficient: 1.0}
  hand_flag: {coefficient: 0.0}
  handedness: {coefficient: 0.0}

augmentation: {enabled: false}
validation: {enabled: false}

sampling:
  epoch_size: 128

outputs:
  run_dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-3.0}/hand_landmarker_runs/${HAND_PRETRAIN_ID:-v3-pretrain-r1}/smoke"

smoke_gate:
  expected_records: 128
  maximum_mean_mae: 0.01
  maximum_p90_mae: 0.02
  maximum_max_mae: 0.05
