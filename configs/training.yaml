schema_version: 1
task: train
stage: pretrain
profile: "${HLML_STAGE:-geometry}"

experiment:
  name: "hlml_v4_${HLML_STAGE:-geometry}"
  seed: 20260801

environment:
  python: ">=3.8,<3.9"
  tensorflow: "==2.9.0"
  cuda: "11.2"
  cudnn_major: 8
  require_gpu: true

data:
  data_root: "${HAND_DATASET_ROOT:-/root/autodl-tmp/DatesetFab}"
  labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/snapshots/${HLML_SNAPSHOT_ID:-v4-r1}/${HLML_STAGE:-geometry}/train.jsonl"
  curation_manifest: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/snapshots/${HLML_SNAPSHOT_ID:-v4-r1}/${HLML_STAGE:-geometry}/snapshot.json"
  require_curation_schema: hlml_warehouse_snapshot_v1
  require_schema_version: hlml_warehouse_train_v1
  require_training_stage: pretrain
  crop_path_key: crop_path
  path_policy: canonical_crop_path_only
  allowed_crop_roots: ["${HAND_DATASET_ROOT:-/root/autodl-tmp/DatesetFab}"]
  image_size: [256, 256]
  channels: 1
  color_mode: grayscale
  input_layout: NCHW
  input_dtype: float32
  input_scale: 0.00392156862745098
  input_offset: 0.0
  cache: false

model:
  version: v2
  checkpoint_stage: pretrain
  input_shape: [1, 256, 256]
  input_layout: NCHW
  num_iterations: [2, 2, 3, 4, 4, 6, 6]
  output_order: [landmarks, hand_flag, handedness]
  output_sizes: {landmarks: 42, hand_flag: 1, handedness: 1}

targets:
  num_landmarks: 21
  landmark_field: landmarks_crop_norm
  landmark_space: normalized_crop_xy
  landmark_order: id_0_to_20_interleaved_xy
  presence_field: hand_presence.present
  handedness_field: handedness.label
  handedness_encoding: {Left: 0, Right: 1, unknown: null}

training:
  epochs: 80
  batch_size: 64
  steps_per_epoch: null
  initial_checkpoint: null
  resume_checkpoint: null
  gradient_clip_norm: 5.0
  mixed_precision: false
  progress_bar: tqdm
  optimizer:
    name: adam
    learning_rate: 0.0003
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-7
  checkpoint: {monitor: val_landmark_mae, mode: min}
  periodic_checkpoint: {enabled: true, every_epochs: 5, max_to_keep: 16}
  max_wall_time_hours: 10.0
  learning_rate_schedule:
    name: reduce_on_plateau
    monitor: val_landmark_mae
    mode: min
    factor: 0.5
    patience: 5
    min_delta: 0.0002
    min_learning_rate: 1.0e-6
  early_stopping:
    enabled: true
    monitor: val_landmark_mae
    mode: min
    patience: 20
    min_delta: 0.0002
    restore_best_weights: true

sampling:
  enabled: true
  stratify_by: [supervision_tier, sample_type]
  tier_key: supervision_tier
  bucket_key: sampling_bucket
  sample_type_key: sample_type
  dataset_key: dataset_id
  source_group_key: source_group_id
  weight_key: sampling_weight
  sample_type_fractions:
    POS_RUNTIME: 1.00
    POS_LOW_PALM: 0.00
    NEG_RUNTIME_CANDIDATE: 0.0
    NEG_LOW_PALM_CANDIDATE: 0.0
  missing_cell_policy: {pseudo: fail}
  quota_rounding: largest_remainder
  quota_tie_break: [POS_RUNTIME, POS_LOW_PALM, NEG_RUNTIME_CANDIDATE, NEG_LOW_PALM_CANDIDATE]
  require_all_tier_sample_type_cells: true
  epoch_size: 102400
  replacement: true
  honor_record_sampling_weight: true

losses:
  landmarks: {name: huber, delta: 0.05, coefficient: 20.0}
  hand_flag: {name: binary_crossentropy, from_logits: false, coefficient: 0.1}
  handedness: {name: binary_crossentropy, from_logits: false, coefficient: 0.0}
  bone_vector: {name: huber, delta: 0.05, coefficient: 0.0}
  spread_ratio: {name: huber, delta: 0.10, coefficient: 0.0}
  honor_record_loss_weights: true

augmentation:
  enabled: true
  brightness_delta: 0.12
  contrast_range: [0.85, 1.15]
  gaussian_noise_stddev: 0.01
  rotation_degrees: 8.0
  scale_range: [0.95, 1.05]
  translation_fraction: 0.03
  horizontal_flip_probability: 0.0

validation:
  enabled: true
  labels: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/snapshots/${HLML_SNAPSHOT_ID:-v4-r1}/${HLML_STAGE:-geometry}/val.jsonl"
  crop_path_key: crop_path
  path_policy: canonical_crop_path_only
  allowed_crop_roots: ["${HAND_DATASET_ROOT:-/root/autodl-tmp/DatesetFab}"]
  batch_size: 128
  every_epochs: 1

outputs:
  run_dir: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/runs/${HLML_EXPERIMENT_ID:-v4-r1}/${HLML_STAGE:-geometry}"
  overwrite: false

runtime:
  gpu_memory_growth: true
  deterministic: false
  fail_on_nan: true

profiles:
  geometry: {}

  multitask:
    experiment: {name: hlml_v4_multitask}
    training:
      initial_checkpoint: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/runs/${HLML_EXPERIMENT_ID:-v4-r1}/geometry/checkpoints/best.weights.h5"
      max_wall_time_hours: null
      periodic_checkpoint: {enabled: false}
      optimizer: {learning_rate: 0.00005}
      checkpoint: {monitor: val_multitask_score, mode: min}
      early_stopping: {monitor: val_multitask_score, mode: min, patience: 15}
      multitask_monitor:
        enabled: true
        name: val_multitask_score
        landmark_mae_weight: 1.0
        hand_flag_error_weight: 0.02
        handedness_error_weight: 0.005
    sampling:
      epoch_size: auto
      epoch_size_upper_bound: 6400
      max_average_cell_draws_per_unique_record: 4.0
      max_expected_row_draws_per_epoch: 8.0
      sample_type_fractions:
        POS_RUNTIME: 0.72
        POS_LOW_PALM: 0.18
        NEG_RUNTIME_CANDIDATE: 0.0
        NEG_LOW_PALM_CANDIDATE: 0.10
    losses:
      hand_flag: {name: binary_crossentropy, from_logits: false, coefficient: 0.25}
      handedness: {name: binary_crossentropy, from_logits: false, coefficient: 0.05}

  multi_finetune:
    stage: finetune
    experiment: {name: hlml_v4_multi_finetune}
    data: {require_training_stage: finetune}
    model: {checkpoint_stage: finetune}
    training:
      epochs: 40
      initial_checkpoint: "${HAND_TRAIN_ROOT:-/root/autodl-tmp/TrainFab/HLML-4.0}/runs/${HLML_EXPERIMENT_ID:-v4-r1}/multitask/checkpoints/best.weights.h5"
      max_wall_time_hours: null
      gold_fraction: 0.55
      optimizer: {learning_rate: 0.00005}
      periodic_checkpoint: {enabled: false}
    sampling:
      epoch_size: 12000
      quota_scope:
        supervision_tier: per_batch_half_up
        sample_type: per_epoch_largest_remainder
      batch_distribution: deterministic_balanced_deficit
      tail_batch_policy: allow_smaller_final_batch
      sample_type_fractions_by_tier:
        gold: {POS_RUNTIME: 0.70, POS_LOW_PALM: 0.20, NEG_RUNTIME_CANDIDATE: 0.0, NEG_LOW_PALM_CANDIDATE: 0.10}
        pseudo: {POS_RUNTIME: 0.80, POS_LOW_PALM: 0.20, NEG_RUNTIME_CANDIDATE: 0.0, NEG_LOW_PALM_CANDIDATE: 0.0}
      missing_cell_policy: {gold: redistribute_within_tier, pseudo: redistribute_within_tier}
      rare_cell_policy:
        gold: cap_fraction_then_redistribute_within_tier
        pseudo: cap_fraction_then_redistribute_within_tier
        max_average_draws_per_unique_record: 4.0
        max_expected_row_draws_per_epoch: 8.0
    losses:
      supervision_tier_weights: {gold: 1.0, pseudo: 1.0}
      hand_flag: {name: binary_crossentropy, from_logits: false, coefficient: 0.25}
      handedness: {name: binary_crossentropy, from_logits: false, coefficient: 0.02}
